name: Dev Build

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: |
          VERSION="dev-$(date +%Y%m%d%H%M)-$(echo $GITHUB_SHA | cut -c1-7)"
          COMMIT="$(echo $GITHUB_SHA | cut -c1-7)"
          go build -ldflags "-X github.com/Olyxz16/ytcli/internal/cmdx.Version=$VERSION -X github.com/Olyxz16/ytcli/internal/cmdx.Commit=$COMMIT" -o ytcli ./cmd/ytcli

      - name: Package artifact
        run: |
          VERSION="dev-$(date +%Y%m%d%H%M)-$(echo $GITHUB_SHA | cut -c1-7)"
          tar czf ytcli-${VERSION}-linux-amd64.tar.gz ytcli

      - uses: actions/upload-artifact@v4
        with:
          name: ytcli-dev
          path: ytcli-dev-*.tar.gz

      - name: Update dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="dev-$(date +%Y%m%d%H%M)-$(echo $GITHUB_SHA | cut -c1-7)"
          COMMIT="$(echo $GITHUB_SHA | cut -c1-7)"
          go build -ldflags "-X github.com/Olyxz16/ytcli/internal/cmdx.Version=$VERSION -X github.com/Olyxz16/ytcli/internal/cmdx.Commit=$COMMIT" -o ytcli ./cmd/ytcli
          tar czf ytcli-${VERSION}-linux-amd64.tar.gz ytcli

          # Delete existing dev release if it exists
          gh release delete dev --yes 2>/dev/null || true

          gh release create dev ytcli-${VERSION}-linux-amd64.tar.gz \
            --title "Dev Build ($VERSION)" \
            --notes "Development build from \`dev\` branch.

          Commit: ${COMMIT}
          Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --prerelease