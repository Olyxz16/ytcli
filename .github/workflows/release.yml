name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build Linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(echo $GITHUB_SHA | cut -c1-7)"
          go build -ldflags "-X github.com/Olyxz16/tkt/internal/cmdx.Version=$VERSION -X github.com/Olyxz16/tkt/internal/cmdx.Commit=$COMMIT" -o tkt-linux-amd64 ./cmd/tkt
          tar czf tkt-${VERSION}-linux-amd64.tar.gz tkt-linux-amd64

      - name: Build Linux arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(echo $GITHUB_SHA | cut -c1-7)"
          go build -ldflags "-X github.com/Olyxz16/tkt/internal/cmdx.Version=$VERSION -X github.com/Olyxz16/tkt/internal/cmdx.Commit=$COMMIT" -o tkt-linux-arm64 ./cmd/tkt
          tar czf tkt-${VERSION}-linux-arm64.tar.gz tkt-linux-arm64

      - name: Build macOS amd64
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(echo $GITHUB_SHA | cut -c1-7)"
          go build -ldflags "-X github.com/Olyxz16/tkt/internal/cmdx.Version=$VERSION -X github.com/Olyxz16/tkt/internal/cmdx.Commit=$COMMIT" -o tkt-darwin-amd64 ./cmd/tkt
          tar czf tkt-${VERSION}-darwin-amd64.tar.gz tkt-darwin-amd64

      - name: Build macOS arm64
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(echo $GITHUB_SHA | cut -c1-7)"
          go build -ldflags "-X github.com/Olyxz16/tkt/internal/cmdx.Version=$VERSION -X github.com/Olyxz16/tkt/internal/cmdx.Commit=$COMMIT" -o tkt-darwin-arm64 ./cmd/tkt
          tar czf tkt-${VERSION}-darwin-arm64.tar.gz tkt-darwin-arm64

      - name: Build Windows amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(echo $GITHUB_SHA | cut -c1-7)"
          go build -ldflags "-X github.com/Olyxz16/tkt/internal/cmdx.Version=$VERSION -X github.com/Olyxz16/tkt/internal/cmdx.Commit=$COMMIT" -o tkt-windows-amd64.exe ./cmd/tkt
          zip tkt-${VERSION}-windows-amd64.zip tkt-windows-amd64.exe

      - name: Run tests
        run: go test ./...

      - name: Create Debian package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="$(echo $GITHUB_SHA | cut -c1-7)"
          mkdir -p tkt_${VERSION}_amd64/DEBIAN
          mkdir -p tkt_${VERSION}_amd64/usr/local/bin
          cp tkt-linux-amd64 tkt_${VERSION}_amd64/usr/local/bin/tkt
          chmod +x tkt_${VERSION}_amd64/usr/local/bin/tkt
          cat > tkt_${VERSION}_amd64/DEBIAN/control <<EOF
          Package: tkt
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: tkt
          Description: A fast, agent-friendly CLI for project management
           Manage issues, articles, and projects from the command line.
           Supports offline-first workflow with local SQLite store and bidirectional sync.
          EOF
          dpkg-deb --build tkt_${VERSION}_amd64

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            tkt-${{ github.ref_name }}-linux-amd64.tar.gz
            tkt-${{ github.ref_name }}-linux-arm64.tar.gz
            tkt-${{ github.ref_name }}-darwin-amd64.tar.gz
            tkt-${{ github.ref_name }}-darwin-arm64.tar.gz
            tkt-${{ github.ref_name }}-windows-amd64.zip
            tkt_*.deb

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(echo $GITHUB_SHA | cut -c1-7)"

          DEB_PKG=$(ls tkt_*.deb)

          gh release create "$VERSION" \
            tkt-${VERSION}-linux-amd64.tar.gz \
            tkt-${VERSION}-linux-arm64.tar.gz \
            tkt-${VERSION}-darwin-amd64.tar.gz \
            tkt-${VERSION}-darwin-arm64.tar.gz \
            tkt-${VERSION}-windows-amd64.zip \
            ${DEB_PKG} \
            --title "tkt ${VERSION}" \
            --notes "## tkt ${VERSION}

          ### Downloads
          - **Linux (amd64)**: \`tkt-${VERSION}-linux-amd64.tar.gz\`
          - **Linux (arm64)**: \`tkt-${VERSION}-linux-arm64.tar.gz\`
          - **macOS (Intel)**: \`tkt-${VERSION}-darwin-amd64.tar.gz\`
          - **macOS (Apple Silicon)**: \`tkt-${VERSION}-darwin-arm64.tar.gz\`
          - **Windows (amd64)**: \`tkt-${VERSION}-windows-amd64.zip\`
          - **Debian/Ubuntu (amd64)**: \`${DEB_PKG}\`

          ### Install
          \`\`\`bash
          # Linux/macOS
          tar xzf tkt-${VERSION}-linux-amd64.tar.gz
          sudo mv tkt-linux-amd64 /usr/local/bin/tkt

          # Debian/Ubuntu
          sudo dpkg -i ${DEB_PKG}

          # Windows
          # Extract the zip and add tkt.exe to your PATH
          \`\`\`"